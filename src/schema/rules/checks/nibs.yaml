---
# Non-invasive brain stimulation (BEP037)
NibsEventIdUnique:
  issue:
    code: NIBS_EVENT_ID_NOT_UNIQUE
    message: |
      `nibs_event_id` MUST be unique within a `*_nibs.tsv` file.
      Each row defines one stimulation parameter set.
    level: error
  selectors:
    - datatype == "nibs"
    - suffix == "nibs"
    - extension == ".tsv"
  checks:
    - length(unique(columns.nibs_event_id)) == length(columns.nibs_event_id)

NibsPositionIdUnique:
  issue:
    code: NIBS_POSITION_ID_NOT_UNIQUE
    message: |
      `nibs_position_id` MUST be unique within a `*_markers.tsv` file.
      Each row describes one element placement.
    level: error
  selectors:
    - datatype == "nibs"
    - suffix == "markers"
    - extension == ".tsv"
  checks:
    - length(unique(columns.nibs_position_id)) == length(columns.nibs_position_id)

NibsEventIdResolves:
  issue:
    code: NIBS_EVENT_ID_UNRESOLVED
    message: |
      Every `nibs_event_id` in a `*_events.tsv` file MUST match a row of the associated
      `*_nibs.tsv`.
    level: error
  selectors:
    - suffix == "events"
    - extension == ".tsv"
    - '"nibs" in associations'
    - columns.nibs_event_id != null
  checks:
    - subset(without(columns.nibs_event_id, "n/a"), associations.nibs.nibs_event_id)

NibsPositionIdResolves:
  issue:
    code: NIBS_POSITION_ID_UNRESOLVED
    message: |
      Every `nibs_position_id` in a `*_events.tsv` file MUST match a row of the associated
      `*_markers.tsv`.
    level: error
  selectors:
    - suffix == "events"
    - extension == ".tsv"
    - '"nibs_markers" in associations'
    - columns.nibs_position_id != null
  checks:
    - subset(without(flatten(split(columns.nibs_position_id, "|")), "n/a"), associations.nibs_markers.nibs_position_id)

NibsElementIdDefined:
  issue:
    code: NIBS_ELEMENT_ID_UNDEFINED
    message: |
      Every `nibs_element_id` used in `*_nibs.tsv` MUST correspond to an `ElementID`
      of an `ElementSet` entry in `*_nibs.json`.
    level: error
  selectors:
    - datatype == "nibs"
    - suffix == "nibs"
    - extension == ".tsv"
    - columns.nibs_element_id != null
    - type(sidecar.ElementSet) == "array"
  checks:
    - subset(without(flatten(split(columns.nibs_element_id, "|")), "n/a"), pluck(sidecar.ElementSet, "ElementID"))

NibsIntensityReferenceDefined:
  issue:
    code: NIBS_INTENSITY_REFERENCE_UNDEFINED
    message: |
      Every `intensity_reference` other than the reserved value `absolute` MUST correspond
      to an `IntensityID` of an `IntensitySet` entry in `*_nibs.json`.
    level: error
  selectors:
    - datatype == "nibs"
    - suffix == "nibs"
    - extension == ".tsv"
    - columns.intensity_reference != null
    - type(sidecar.IntensitySet) == "array"
  checks:
    - subset(without(flatten(split(columns.intensity_reference, "|")), "absolute", "n/a"), pluck(sidecar.IntensitySet, "IntensityID"))

NibsTESIntensitySumsToZero:
  issue:
    code: NIBS_TES_INTENSITY_SUM
    message: |
      For `tES`, the `|`-delimited `stimulus_intensity` values across simultaneous elements
      MUST sum to 0.
    level: error
  selectors:
    - datatype == "nibs"
    - suffix == "nibs"
    - extension == ".tsv"
    - intersects(columns.nibs_type, ["tES"])
    - columns.stimulus_intensity != null
  checks:
    - allequal(round(sum(split(without(filter(columns.stimulus_intensity, columns.nibs_type, "tES"), "n/a"), "|")), 6), 0)

NibsCustomShapeDescribed:
  issue:
    code: NIBS_CUSTOM_SHAPE_UNDESCRIBED
    message: |
      A `stimulus_shape` of `Custom` requires a free-text `stimulus_description`.
    level: error
  selectors:
    - datatype == "nibs"
    - suffix == "nibs"
    - extension == ".tsv"
    - intersects(columns.stimulus_shape, ["Custom"])
  checks:
    - length(without(filter(columns.stimulus_description, columns.stimulus_shape, "Custom"), "n/a")) == count(columns.stimulus_shape, "Custom")

NibsPattern1IntensityLength:
  issue:
    code: NIBS_PATTERN1_INTENSITY_LENGTH
    message: |
      The number of `|`-delimited values in `pattern1_intensity` MUST equal `pattern1_count`.
    level: error
  selectors:
    - datatype == "nibs"
    - suffix == "nibs"
    - extension == ".tsv"
    - columns.pattern1_intensity != null
    - columns.pattern1_count != null
  checks:
    - allequal(lengths(split(filter(columns.pattern1_intensity, columns.pattern1_intensity, "n/a", true), "|")), number(filter(columns.pattern1_count, columns.pattern1_intensity, "n/a", true)))

