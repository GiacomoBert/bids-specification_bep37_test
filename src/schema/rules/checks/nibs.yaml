NibsDelimiterDeclaredNibsElementId:
  issue:
    code: NIBS_DELIMITER_NOT_DECLARED
    message: |
      `nibs_element_id` uses the `|` delimiter, so the delimiter MUST be declared for that column
      in the corresponding JSON sidecar, as a `Delimiter` entry for that column.
    level: error
  selectors:
    - datatype == "nibs"
    - suffix == "nibs"
    - extension == ".tsv"
    - columns.nibs_element_id != null
  checks:
    - max(lengths(split(columns.nibs_element_id, "|"))) == 1 || (sidecar.nibs_element_id != null && sidecar.nibs_element_id.Delimiter == "|")

