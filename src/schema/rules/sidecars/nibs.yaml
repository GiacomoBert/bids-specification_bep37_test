---
# Non-invasive brain stimulation (BEP037)
NibsSidecar:
  selectors:
    - datatype == "nibs"
    - suffix == "nibs"
  fields:
    NIBSDescription: recommended
    ConcurrentModalities: recommended
    IntendedFor: optional
    StimulatorSet: recommended
    ElementSet: recommended
    IntensitySet: optional
    NavigationSystem: optional
    TaskName: optional
    TaskDescription: optional
    Instructions: optional
    InstitutionName: optional
    InstitutionAddress: optional
    InstitutionalDepartmentName: optional

NibsConcurrentSidecar:
  selectors:
    - datatype == "nibs"
    - suffix == "nibs"
    - sidecar.ConcurrentModalities != null
    - '!intersects(sidecar.ConcurrentModalities, ["none"])'
  fields:
    IntendedFor: recommended

NibsMarkersSidecar:
  selectors:
    - datatype == "nibs"
    - suffix == "markers"
  fields:
    NavigationSystem: optional

NibsCoordsystem:
  selectors:
  - datatype == "nibs"
  - suffix == "coordsystem"
  fields:
    NIBSCoordinateSystem: required
    NIBSCoordinateUnits: required
    NIBSCoordinateSystemDescription: recommended
    IntendedFor: recommended
    FiducialsDescription: optional
    FiducialsCoordinates: optional
    FiducialsCoordinateSystem: optional
    FiducialsCoordinateUnits: optional
    FiducialsCoordinateSystemDescription: optional
    AnatomicalLandmarkCoordinates: optional
    AnatomicalLandmarkCoordinateSystem: optional
    AnatomicalLandmarkCoordinateUnits: optional
    AnatomicalLandmarkCoordinateSystemDescription: optional
    AnatomicalLandmarkCoordinatesDescription: optional
    AnatomicalLandmarkRmsDeviation: optional
    AnatomicalLandmarkRmsDeviationUnits: optional
    AnatomicalLandmarkRmsDeviationDescription: optional
    HeadMeasurements: optional
    HeadMeasurementsUnits: optional
    HeadMeasurementsDescription: optional
    DigitizedHeadPoints: optional
    DigitizedHeadPointsNumber: optional
    DigitizedHeadPointsDescription: optional
    DigitizedHeadPointsUnits: optional
    TransducerCoordinates: optional
    TransducerCoordinateUnits: optional
    TransducerCoordinateSystemDescription: optional
    TransducerCoordinatesDescription: optional
    TransducerRmsDeviation: optional
    TransducerRmsDeviationUnits: optional
    TransducerRmsDeviationDescription: optional
