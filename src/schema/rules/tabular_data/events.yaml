---
Events:
  selectors:
    - suffix == "events"
  columns:
    onset: required
    duration: required
    trial_type: optional
    response_time: optional
    HED: optional
    stim_file: optional
    channel:
      level: optional
      description_addendum: |
        Note that this column only applies to data types where
        channels are specified, such as EEG, iEEG, MEG or NIRS.
    nibs_event_id__events:
      level: optional
      description_addendum: |
        Note that this column only applies when non-invasive brain stimulation
        was delivered, and references a row of the associated `*_nibs.tsv`.
    nibs_position_id__events:
      level: optional
      description_addendum: |
        Note that this column only applies when non-invasive brain stimulation
        was delivered, and references rows of the associated `*_markers.tsv`.
  additional_columns: allowed
  initial_columns:
    - onset
    - duration

Behavioral:
  selectors:
    - suffix == "beh"
  columns:
    trial_type: optional
    response_time: optional
    HED: optional
    stim_file: optional
  additional_columns: allowed
