# type column for electrodes.tsv files
type__electrodes:
  name: type
  display_name: Electrode type
  description: |
    Type of the electrode (for example, cup, ring, clip-on, wire, needle).
  type: string
type__optodes:
  name: type
  display_name: Type
  description: |
    The type of the optode.
  type: string
  enum:
    - $ref: objects.enums.source.value
    - $ref: objects.enums.detector.value
units:
  name: units
  display_name: Units
  description: |
    Physical unit of the value represented in this channel,
    for example, `V` for Volt, or `fT/cm` for femto Tesla per centimeter
    (see [Units](SPEC_ROOT/common-principles.md#units)).
  type: string
  format: unit
units__nirs:
  name: units
  display_name: Units
  description: |
    Physical unit of the value represented in this channel,
    specified according to the SI unit symbol and possibly prefix symbol,
    or as a derived SI unit (for example, `V`, or unitless for changes in optical densities).
    For guidelines about units see the [Appendix](SPEC_ROOT/appendices/units.md)
    and [Common Principles](SPEC_ROOT/common-principles.md#units) pages.
  type: string
  format: unit
units__motion:
  name: units
  display_name: Units
  description: |
    Physical or virtual unit of the value represented in this channel,
    for example, '"rad"' or '"deg"' for angular quantities or '"m"' for position data.
    If motion data is recorded in a virtual space and deviate from standard SI units,
    the unit used MUST be specified in the sidecar `*_motion.json`
    file (for example `"vm"` for virtual meters). `"rad"` is used for Euler angles
    and `"n/a"` for quaternions.
    For guidelines about units see the [Appendix](SPEC_ROOT/appendices/units.md)
    and [Common Principles](SPEC_ROOT/common-principles.md#units) pages.
  type: string
  format: unit
volume_type:
  name: volume_type
  display_name: ASL volume type
  description: |
    The `*_aslcontext.tsv` table consists of a single column of labels identifying
    the `volume_type` of each volume in the corresponding `*_asl.nii[.gz]` file.
  type: string
  enum:
    - $ref: objects.enums.control.value
    - $ref: objects.enums.label.value
    - $ref: objects.enums.m0scan.value
    - $ref: objects.enums.deltam.value
    - $ref: objects.enums.cbf.value
    - $ref: objects.enums.noRF.value
wavelength_nominal:
  name: wavelength_nominal
  display_name: Wavelength nominal
  description: |
    Specified wavelength of light in nm.
    `n/a` for channels that do not contain raw NIRS signals (for example, acceleration).
    This field is equivalent to `/nirs(i)/probe/wavelengths` in the SNIRF specification.
  type: number
wavelength_actual:
  name: wavelength_actual
  display_name: Wavelength actual
  description: |
    Measured wavelength of light in nm.
    `n/a` for channels that do not contain raw NIRS signals (acceleration).
    This field is equivalent to `measurementList.wavelengthActual` in the SNIRF specification.
  type: number
wavelength_emission_actual:
  name: wavelength_emission_actual
  display_name: Wavelength emission actual
  description: |
    Measured emission wavelength of light in nm.
    `n/a` for channels that do not contain raw NIRS signals (acceleration).
    This field is equivalent to `measurementList.wavelengthEmissionActual` in the SNIRF specification.
  type: number
whole_blood_radioactivity:
  name: whole_blood_radioactivity
  display_name: Whole blood radioactivity
  description: |
    Radioactivity in whole blood samples,
    in unit of radioactivity measurements in whole blood samples (for example, `kBq/mL`).
  type: number
x:
  name: x
  display_name: X position
  description: |
    Recorded position along the x-axis.
  type: number
y:
  name: y
  display_name: Y position
  description: |
    Recorded position along the y-axis.
  type: number
z:
  name: z
  display_name: Z position
  description: |
    Recorded position along the z-axis.
  type: number
x__optodes:
  name: x
  display_name: X position
  description: |
    Recorded position along the x-axis.
    `"n/a"` if not available.
  type: number
y__optodes:
  name: y
  display_name: Y position
  description: |
    Recorded position along the y-axis.
    `"n/a"` if not available.
  type: number
z__optodes:
  name: z
  display_name: Z position
  description: |
    Recorded position along the z-axis.
    `"n/a"` if not available.
  type: number
template_x:
  name: template_x
  display_name: X template position
  description: |
    Assumed or ideal position along the x axis.
  type: number
template_y:
  name: template_y
  display_name: Y template position
  description: |
    Assumed or ideal position along the y axis.
  type: number
template_z:
  name: template_z
  display_name: Z template position
  description: |
    Assumed or ideal position along the z axis.
  type: number
# NIBS-BIDS (BEP037) columns
nibs_event_id:
  name: nibs_event_id
  display_name: NIBS event identifier
  description: 'Identifier of a stimulation parameter set.

    Referenced from `*_events.tsv`.

    MUST be unique within `*_nibs.tsv`.

    '
  type: string
nibs_type:
  name: nibs_type
  display_name: NIBS type
  description: 'Stimulation modality.

    PNS uses whichever physical technology applies, and the stimulated nerve is described in

    `*_markers.tsv`.

    '
  type: string
  enum:
  - TMS
  - tES
  - TUS
  - PNS
stimulator_id:
  name: stimulator_id
  display_name: Stimulator identifier
  description: 'Device that generates the stimulus waveform.

    References `StimulatorSet.StimulatorID` in `*_nibs.json`.

    '
  type: string
nibs_element_id:
  name: nibs_element_id
  display_name: NIBS element identifier
  description: 'Element that delivers the stimulation.

    References `ElementSet.ElementID` in `*_nibs.json`.

    Multiple simultaneous elements are separated by `|`.

    '
  type: string
  delimiter: '|'
stimulus_shape:
  name: stimulus_shape
  display_name: Stimulus shape
  description: 'Waveform shape of the base stimulus.

    `Monophasic`, `Biphasic` and `Halfsine` apply to TMS;

    `Rectangle`, `Sinusoid` and `Noise` apply to tES;

    `Sinusoid` applies to TUS;

    `Custom` applies to any modality and requires `stimulus_description`.

    '
  type: string
  enum:
  - Monophasic
  - Biphasic
  - Halfsine
  - Rectangle
  - Sinusoid
  - Noise
  - Custom
stimulus_intensity:
  name: stimulus_intensity
  display_name: Stimulus intensity
  description: 'Delivered amplitude of the base stimulus.

    Units are modality dependent and MUST be declared in `*_nibs.json`.

    With multiple elements, one value per element separated by `|`;

    for `tES` the delimited values MUST sum to 0.

    Set to `n/a` when per-stimulus intensities are given in `pattern1_intensity`.

    '
  type: number
  delimiter: '|'
stimulus_duration:
  name: stimulus_duration
  display_name: Stimulus duration
  description: 'Duration of the base stimulus, the time during which contiguous non-zero current or energy

    is delivered.

    '
  type: number
first_inflection:
  name: first_inflection
  display_name: First inflection
  description: '(TMS) Direction of the first deflection of the induced current, corresponding to the normal

    or reverse setting on the stimulator.

    '
  type: string
  enum:
  - rising
  - descending
current_direction:
  name: current_direction
  display_name: Coil current direction
  description: '(TMS) Direction of current flow in the coil winding, read with the stimulating face pointing

    away from the viewer and the handle pointing away.

    `cl` and `co` describe a circular coil, clockwise and counterclockwise.

    `cl-co` and `co-cl` describe a figure-of-eight coil, left wing then right wing.

    `other` requires a free-text description under `Levels.other`.

    May be `|`-delimited and aligned to `nibs_element_id`.

    '
  type: string
  enum:
  - cl
  - co
  - cl-co
  - co-cl
  - other
  delimiter: '|'
ramp_up:
  name: ramp_up
  display_name: Ramp up
  description: '(`Rectangle`) Duration of the linear current ramp at the start of the block.

    '
  type: number
ramp_down:
  name: ramp_down
  display_name: Ramp down
  description: '(`Rectangle`) Duration of the linear current ramp at the end of the block.

    '
  type: number
frequency:
  name: frequency
  display_name: Frequency
  description: '(`Sinusoid`) Oscillation frequency for tACS, or carrier frequency for TUS.

    '
  type: number
starting_phase:
  name: starting_phase
  display_name: Starting phase
  description: '(`Sinusoid`) Starting phase in degrees.

    May be `|`-delimited and aligned with `nibs_element_id` for phase-shifted or anti-phase tACS.

    '
  type: number
  delimiter: '|'
offset:
  name: offset
  display_name: Offset
  description: '(`Sinusoid`) Constant component added to the oscillation.

    '
  type: number
noise_type:
  name: noise_type
  display_name: Noise type
  description: '(`Noise`) Spectral character of the noise, for example `white` or `pink`.

    '
  type: string
frequency_low:
  name: frequency_low
  display_name: Lower frequency bound
  description: '(`Noise`) Lower bound of the randomized band.

    '
  type: number
frequency_high:
  name: frequency_high
  display_name: Upper frequency bound
  description: '(`Noise`) Upper bound of the randomized band.

    '
  type: number
distribution:
  name: distribution
  display_name: Amplitude distribution
  description: '(`Noise`) Amplitude distribution, for example `gaussian`.

    '
  type: string
stimulus_description:
  name: stimulus_description
  display_name: Stimulus description
  description: '(`Custom`) Free-text description of a waveform not covered by the `stimulus_shape` vocabulary.

    '
  type: string
intensity_reference:
  name: intensity_reference
  display_name: Intensity reference
  description: 'Anchor used to set the intensity.

    References `IntensitySet.IntensityID` in `*_nibs.json`.

    `absolute` is reserved for directly specified intensities and needs no `IntensitySet` entry.

    '
  type: string
  enum:
  - rMT
  - aMT
  - 1mV
  - e-field
  - absolute
  delimiter: '|'
intensity_scaling:
  name: intensity_scaling
  display_name: Intensity scaling
  description: 'Multiplier applied to the reference value, for example `0.8` for 80% of the reference,

    or `absolute` for a directly specified value.

    '
  type: string
  format: nibs_scaling
  delimiter: '|'
stimulus_count:
  name: stimulus_count
  display_name: Stimulus count
  description: 'Counter of deliveries of the same parameter set to the same position within the file.

    For counting only, and MUST NOT be used for synchronization.

    '
  type: number
stimulus_validation:
  name: stimulus_validation
  display_name: Stimulus validation
  description: 'Whether delivery or positioning was verified.

    '
  type: string
  enum:
  - verified
  - observed
  - not_verified
  - unknown
subject_feedback:
  name: subject_feedback
  display_name: Subject feedback
  description: 'Participant-reported perception or discomfort.

    '
  type: string
timestamp:
  name: timestamp
  display_name: Timestamp
  description: 'ISO 8601 time at which the stimulation occurred or was logged.

    '
  type: string
  format: datetime
electric_field_target:
  name: electric_field_target
  display_name: Electric field at target
  description: '(TMS) Electric field at the target, as reported or modelled by the device or navigation
    system.

    '
  type: number
electric_field_max:
  name: electric_field_max
  display_name: Peak electric field
  description: '(TMS) Peak electric field, as reported or modelled.

    '
  type: number
electric_field_units:
  name: electric_field_units
  display_name: Electric field units
  description: 'Units for the electric-field values, RECOMMENDED `V/m`.

    '
  type: string
  format: unit
electric_field_model_name:
  name: electric_field_model_name
  display_name: Electric field model name
  description: 'Source model or system for the electric-field values.

    '
  type: string
electric_field_model_version:
  name: electric_field_model_version
  display_name: Electric field model version
  description: 'Version of the model or system that produced the electric-field values.

    '
  type: string
contact_impedance:
  name: contact_impedance
  display_name: Contact impedance
  description: '(tES) Measured contact impedance, one value per element when `|`-delimited.

    '
  type: number
  delimiter: '|'
measured_current_intensity:
  name: measured_current_intensity
  display_name: Measured current intensity
  description: '(tES) Device-reported delivered current.

    '
  type: number
measured_voltage_intensity:
  name: measured_voltage_intensity
  display_name: Measured voltage intensity
  description: '(tES) Device-reported delivered voltage.

    '
  type: number
current_statistics:
  name: current_statistics
  display_name: Current statistics
  description: '(tES) Device summary statistics for the delivered current.

    '
  type: string
measured_peak_negative_pressure:
  name: measured_peak_negative_pressure
  display_name: Measured peak negative pressure
  description: '(TUS) Estimated or measured peak negative pressure.

    '
  type: number
spatial_peak_pulse_average_intensity:
  name: spatial_peak_pulse_average_intensity
  display_name: Spatial peak pulse average intensity
  description: '(TUS) ISPPA for the delivered stimulation.

    '
  type: number
spatial_peak_temporal_average_intensity:
  name: spatial_peak_temporal_average_intensity
  display_name: Spatial peak temporal average intensity
  description: '(TUS) ISPTA for the delivered stimulation.

    '
  type: number
mechanical_index:
  name: mechanical_index
  display_name: Mechanical index
  description: '(TUS) Mechanical Index.

    '
  type: number
thermal_index:
  name: thermal_index
  display_name: Thermal index
  description: '(TUS) Thermal Index.

    '
  type: number
nibs_event_id__events:
  name: nibs_event_id
  display_name: NIBS event identifier
  description: 'References `nibs_event_id` in `*_nibs.tsv`, giving the temporal parameters of this delivery.

    '
  type: string
nibs_position_id__events:
  name: nibs_position_id
  display_name: NIBS position identifier
  description: 'References `nibs_position_id` in `*_markers.tsv`, giving the position of the element or
    elements.

    May be `|`-delimited, one position per element, in the same order as `nibs_element_id`.

    '
  type: string
  delimiter: '|'
nibs_position_id:
  name: nibs_position_id
  display_name: NIBS position identifier
  description: 'Identifier of one element placement.

    MUST be unique within `*_markers.tsv`.

    '
  type: string
nibs_element_id__markers:
  name: nibs_element_id
  display_name: NIBS element identifier
  description: 'Element placed at this position.

    References `ElementSet.ElementID` in `*_nibs.json`.

    '
  type: string
position_label:
  name: position_label
  display_name: Position label
  description: 'Standardized label for the placement, for example the 10-20 or 10-10 site `C3`,

    or a site name such as `M1_hand` or `DLPFC`.

    '
  type: string
position_description:
  name: position_description
  display_name: Position description
  description: 'Free-text description of the placement and how it was located.

    '
  type: string
position_group:
  name: position_group
  display_name: Position group
  description: 'Organizational grouping label, for example montage membership.

    MUST NOT be used for linkage or synchronization.

    '
  type: string
element_distance:
  name: element_distance
  display_name: Element distance
  description: 'Physical distance from the element surface to the scalp, for example the thickness of
    padding,

    gel, or hair.

    This affects the delivered dose and SHOULD be recorded whenever it is known, independently of

    whether neuronavigation was used.

    '
  type: number
target_label:
  name: target_label
  display_name: Target label
  description: 'Standardized label or anatomical name of the intended target.

    '
  type: string
peeling_depth:
  name: peeling_depth
  display_name: Peeling depth
  description: 'Depth from the scalp or cortical surface to the target, as reported by a neuronavigation
    system.

    Distinct from `element_distance`, which is the physical standoff of the element from the scalp.

    '
  type: number
element_centre_x:
