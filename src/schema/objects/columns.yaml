  description: 'x coordinate of the centre of the element.

    '
  type: number
target_x:
  name: target_x
  display_name: Target x
  description: 'x coordinate of the intended target, for example a cortical site or an acoustic focus.

    '
  type: number
efield_max_x:
  name: efield_max_x
  display_name: Electric field maximum x
